<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva pestaña</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header id="encabezado">
    <nav>
      <ul>
        <li><a href="#">Gmail</a></li>
        <li><a href="#">Imágenes</a></li>
        <li><a href="#" class="apps" title="Aplicaciones de Google">⋮⋮⋮</a></li>
        <li><span class="avatar">R</span></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="logo">Google</h1>

    <form class="buscador" role="search">
      <button type="button" class="mas">+</button>
      <input type="search" name="q" placeholder="Pregúntale a Google">
      <button type="button" class="icono">🎤</button>
      <button type="button" class="icono">📷</button>
      <button type="button" class="boton-ia">✦ Modo IA</button>
    </form>

    <section class="sugerencias">
      <article class="tarjeta">
        <span class="emoji">🔎</span>
        <div>
          <h2>Haz más cosas con el Modo IA</h2>
          <p>Crea, resume y planifica</p>
        </div>
      </article>
      <article class="tarjeta">
        <span class="emoji">🍌</span>
        <div>
          <h2>Crear imágenes</h2>
          <p>Reimagina, ilustra y edita</p>
        </div>
      </article>
    </section>

    <nav class="accesos">
      <ul>
        <li>
          <a href="#">
            <span class="circulo"><span class="icono-acceso">U</span></span>
            <span class="nombre">Aula Virtual UTEL</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="circulo"><span class="icono-acceso">U</span></span>
            <span class="nombre">UCAMP</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="circulo"><span class="icono-acceso">S</span></span>
            <span class="nombre">SIU UTEL</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="circulo"><span class="icono-acceso">C</span></span>
            <span class="nombre">Canva</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="circulo"><span class="icono-acceso">i</span></span>
            <span class="nombre">Indeed</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span class="circulo"><span class="icono-acceso">⤢</span></span>
            <span class="nombre">Mostrar más</span>
          </a>
        </li>
      </ul>
    </nav>
  </main>

  <aside class="barra-lateral">
    <nav class="aplicaciones">
      <a href="#" title="Traductor">G</a>
      <a href="#" title="WhatsApp">✆</a>
    </nav>
    <nav class="inferior">
      <a href="#" title="Favoritos">♡</a>
      <a href="#" title="Historial">🕒</a>
      <a href="#" title="Configuración">⚙</a>
      <a href="#" title="Más">⋯</a>
    </nav>
  </aside>

  <footer id="pie">
    <button type="button" class="personalizar">✎ Personalizar Chrome</button>
  </footer>

</body>
</html>
