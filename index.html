<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva pestaña</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="principal">

    <div class="encabezado">
      <a href="#">Gmail</a>
      <a href="#">Imágenes</a>
      <span class="apps">⋮⋮⋮</span>
      <div class="avatar">R</div>
    </div>

    <div class="logo">Google</div>

    <div class="buscador">
      <span class="mas">+</span>
      <input type="text" placeholder="Pregúntale a Google">
      <span class="icono">🎤</span>
      <span class="icono">📷</span>
      <button class="boton-ia">✦ Modo IA</button>
    </div>

    <div class="sugerencias">
      <div class="tarjeta">
        <span class="emoji">🔎</span>
        <div>
          <strong>Haz más cosas con el Modo IA</strong>
          <span>Crea, resume y planifica</span>
        </div>
      </div>
      <div class="tarjeta">
        <span class="emoji">🍌</span>
        <div>
          <strong>Crear imágenes</strong>
          <span>Reimagina, ilustra y edita</span>
        </div>
      </div>
    </div>

    <div class="accesos">
      <div class="acceso">
        <div class="circulo"><div class="icono-acceso verde">U</div></div>
        <p>Aula Virtual UTEL</p>
      </div>
      <div class="acceso">
        <div class="circulo"><div class="icono-acceso turquesa">U</div></div>
        <p>UCAMP</p>
      </div>
      <div class="acceso">
        <div class="circulo"><div class="icono-acceso gris">S</div></div>
        <p>SIU UTEL</p>
      </div>
      <div class="acceso">
        <div class="circulo"><div class="icono-acceso canva">▬</div></div>
        <p>Canva</p>
      </div>
      <div class="acceso">
        <div class="circulo"><div class="icono-acceso azul">i</div></div>
        <p>Indeed</p>
      </div>
      <div class="acceso">
        <div class="circulo"><div class="icono-acceso">⤢</div></div>
        <p>Mostrar más</p>
      </div>
    </div>

    <button class="personalizar">✎ Personalizar Chrome</button>
  </div>

  <div class="barra-lateral">
    <div class="app traductor">G</div>
    <div class="app whatsapp">✆</div>
    <div class="inferior">
      <span>♡</span>
      <span>🕒</span>
      <span>⚙</span>
      <span>⋯</span>
    </div>
  </div>

</body>
</html>
